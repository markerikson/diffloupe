name: DiffLoupe Review

# DiffLoupe reviews its own pull requests, using the pull request's own code.
# A change to the review pipeline is exercised on the change itself.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# A push makes an in-flight review obsolete: it is reading code that no longer
# exists, and a run costs real money.
concurrency:
  group: diffloupe-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    # Fork pull requests get no secrets, so the first model call would fail.
    # Same-repository branches come from people who can already push here,
    # which is what makes running the branch's code with the API key acceptable.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No write scope. The model reads the pull request description and diff,
    # which the author wrote; nothing it produces may act on GitHub. The write
    # token lives in the post job, which runs no model.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      reviewed: ${{ steps.result.outputs.reviewed }}
      artifact: ${{ steps.result.outputs.artifact }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      # Outside the workspace, so the review never sees its own output as part
      # of the checkout. Job-level env cannot read the runner context.
      - run: echo "OUT=$RUNNER_TEMP/diffloupe-out" >> "$GITHUB_ENV"

      # The head commit, not the merge commit GitHub synthesizes: line numbers
      # must match the Files Changed tab. Full history for the merge base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Pinned: the runner's command line and the prompts' tool guidance are
      # written against these versions. `opencode-ai` on npm is the 1.x line.
      - run: npm install -g @opencode/cli@2.0.32 tilth@0.9.0

      - run: bun install --frozen-lockfile

      - name: Doctor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: bun src/index.ts doctor

      # Default models: Opus for the review and coordinator, Sonnet for the
      # rest. Exit codes: 0 reviewed or skipped, 1 run failed, 2 could not start.
      - name: Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          bun src/index.ts review "#$PR"
          --headless --github --head "$HEAD_SHA"
          --out "$OUT" --max-cost 10

      - name: Read result
        id: result
        if: always()
        run: |
          set -euo pipefail
          # Absent when the run could not start (exit 2).
          [ -f "$OUT/result.json" ] || exit 0
          echo "reviewed=$(jq -r '.reviewed' "$OUT/result.json")" >> "$GITHUB_OUTPUT"
          echo "artifact=$(jq -r '.artifactName // empty' "$OUT/result.json")" >> "$GITHUB_OUTPUT"
          jq -r '"**\(.status)** — \(.findings.posted) finding(s), $\(.costUsd * 100 | round / 100), \(.wallMs / 1000 | round)s, round \(.round)"' \
            "$OUT/result.json" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$OUT/findings.md" ]; then
            { echo; cat "$OUT/findings.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The summary comment links here for the walkthrough and the evidence
      # behind each finding, so this retention is how long that link works.
      - name: Upload review
        id: upload
        if: always() && steps.result.outputs.artifact != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.result.outputs.artifact }}
          path: ${{ runner.temp }}/diffloupe-out/
          retention-days: 90

  post:
    needs: review
    if: needs.review.outputs.reviewed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with write scope, and it runs no model. It sends the payload
    # file the review job produced, to the pull request named by the event.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.review.outputs.artifact }}
          path: review

      # post.ts imports only node builtins and its own modules, so it needs no
      # install. Replaced by `diffloupe post` once that command exists.
      - name: Post review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_URL: ${{ needs.review.outputs.artifact_url }}
          DRY_RUN: "0"
        run: bun src/review/post.ts review/payloads.json
